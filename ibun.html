<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin – Griya Aleena</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ngadmin.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="foto/logo.png" alt="Griya Aleena" onerror="this.style.display='none'">
      <h1>Griya Aleena</h1>
      <p>Panel Admin Okupansi</p>
    </div>

    <form id="login-form">
      <label>Username
        <input type="text" id="username" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="login-error"></div>
      <button type="submit" id="login-btn">Masuk</button>
    </form>

  </div>
</div>

<script>
const API = 'https://griya-api.lintangglangitt.workers.dev';

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Memproses…';

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login gagal');

    localStorage.setItem('ga_token', data.token);
    localStorage.setItem('ga_user', JSON.stringify(data.user));
    window.location.href = 'ngadmin.html';
  } catch (e) {
    err.textContent = e.message;
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
});

// Redirect kalau sudah login
if (localStorage.getItem('ga_token')) {
  window.location.href = 'ngadmin.html';
}
</script>
</body>
</html>
